<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanzeela S — Creative Archive / 001</title>
<meta name="description" content="Thanzeela S — multidisciplinary designer. A private archive of branding, packaging, poster and visual design case files.">
<meta name="theme-color" content="#101010">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#101010;--s2:#191919;--s3:#202020;--tx:#EAE6DF;--tx2:#9B9892;--ln:#383633;--ac:#8D2929;--act:#C26262;
--serif:'Cormorant Garamond','Cormorant',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
--pad:clamp(20px,4vw,64px);--max:1360px;--hdr:64px;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 8px);overflow-x:clip;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:300 1rem/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,ol,figure,dl,dd{margin:0;padding:0}ul,ol{list-style:none}
:focus-visible{outline:1px solid var(--tx);outline-offset:4px}
::selection{background:var(--ac);color:var(--tx)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.mono{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:400}
.dim{color:var(--tx2)}.ac{color:var(--act)}
.serif{font-family:var(--serif);font-weight:300;letter-spacing:-.01em}
/* ambient light + grid */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
background:repeating-linear-gradient(90deg,transparent 0 calc(100%/12 - 1px),rgba(234,230,223,.035) calc(100%/12 - 1px) calc(100%/12))}
.lamp{position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(420px circle at var(--mx,50%) var(--my,40%),rgba(245,226,176,.075),transparent 70%)}
#ball{position:fixed;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;pointer-events:none;z-index:9999;opacity:0;
background:radial-gradient(circle,#fffaf0 0,#f6e7bf 45%,rgba(246,231,191,.0) 72%);box-shadow:0 0 16px 5px rgba(246,231,191,.5),0 0 60px 22px rgba(246,231,191,.14);transition:opacity .3s}
#ball i{position:absolute;inset:0;border-radius:50%;transition:transform .25s}
#ball.on{opacity:1}#ball.big i{transform:scale(2.4)}
.has-ball,.has-ball a,.has-ball button,.has-ball .fig{cursor:none}
@media (pointer:coarse),(hover:none){#ball,.lamp{display:none}}
main,header,footer{position:relative;z-index:1}
/* boot */
#boot{position:fixed;inset:0;z-index:10000;background:var(--bg);display:grid;place-content:center;gap:14px;text-align:center;transition:opacity .5s,visibility .5s}
#boot.done{opacity:0;visibility:hidden}
#boot .bar{height:1px;background:var(--ln);position:relative;overflow:hidden;width:200px;margin:0 auto}
#boot .bar::after{content:"";position:absolute;inset:0;background:var(--act);transform:translateX(-100%);animation:ld .9s ease forwards}
@keyframes ld{to{transform:none}}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;height:var(--hdr);background:rgba(16,16,16,.97);border-bottom:1px solid var(--ln)}
header.top .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-family:var(--serif);font-size:1.35rem;letter-spacing:.28em;font-weight:400}
.status{display:none;color:var(--tx2)}
nav ul{display:flex;gap:clamp(18px,3vw,40px)}
nav a{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);padding:6px 0;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
nav a:hover,nav a.cur{color:var(--tx);border-color:var(--ac)}
.menu-btn{display:none;width:44px;height:44px;margin-right:-10px;position:relative}
.menu-btn span{position:absolute;left:11px;right:11px;height:1px;background:var(--tx);transition:transform .3s,top .3s}
.menu-btn span:nth-child(1){top:18px}.menu-btn span:nth-child(2){top:25px}
.open .menu-btn span:nth-child(1){top:21px;transform:rotate(45deg)}.open .menu-btn span:nth-child(2){top:21px;transform:rotate(-45deg)}
@media(min-width:1000px){.status{display:block}}
@media(max-width:760px){.menu-btn{display:block}
nav{position:fixed;inset:calc(env(safe-area-inset-top,0px) + var(--hdr)) 0 0 0;background:var(--bg);padding:40px var(--pad);visibility:hidden;opacity:0;transition:opacity .3s,visibility .3s}
.open nav{visibility:visible;opacity:1}
nav ul{flex-direction:column;gap:0}
nav a{display:block;font-family:var(--serif);font-size:2.4rem;letter-spacing:0;text-transform:none;color:var(--tx);padding:14px 0;border-bottom:1px solid var(--ln)}
.rbtn{margin-top:28px;padding:14px 22px;font-size:.8rem}}
/* buttons */
.rbtn{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx);border:1px solid var(--tx2);padding:8px 14px;line-height:1.2;transition:background .3s,color .3s,border-color .3s}
.rbtn:hover{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 24px;border:1px solid var(--tx);font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;transition:background .3s,color .3s,border-color .3s}
.btn:hover{background:var(--tx);color:var(--bg)}
.btn.ghost{border-color:var(--ln);color:var(--tx2)}.btn.ghost:hover{background:transparent;color:var(--tx);border-color:var(--tx)}
.lnk{border-bottom:1px solid var(--ln);transition:border-color .25s,color .25s}.lnk:hover{border-color:var(--act);color:var(--tx)}
/* view transition */
#view{animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
/* hero */
.hero{min-height:calc(100svh - var(--hdr));display:flex;flex-direction:column;justify-content:space-between;padding:clamp(28px,5vw,56px) 0 clamp(28px,4vw,48px);position:relative}
.hero-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;color:var(--tx2)}
.reg{width:44px;height:44px;flex:none;color:var(--ln)}
.hero-main{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end;margin:clamp(40px,8vh,96px) 0}
.hn{grid-column:1/10;min-width:0}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,7vw,5.6rem);line-height:1;letter-spacing:-.02em;white-space:nowrap}
.hero h1 em{font-style:italic;color:var(--tx2)}
.hsub{margin-top:clamp(22px,3vw,40px);font-family:var(--serif);font-weight:300;font-size:clamp(1.3rem,2.4vw,2.1rem);line-height:1.2;color:var(--tx);max-width:24ch;padding-left:16px;border-left:1px solid var(--ac)}
.hero-idx{grid-column:10/13;border-top:1px solid var(--ln)}
.hero-idx a{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--ln);color:var(--tx2);transition:color .25s,padding .25s}
.hero-idx a:hover{color:var(--tx);padding-left:8px}.hero-idx b{font-weight:400;color:var(--act);min-width:56px}
.hero-idx a>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hero-low{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end}
.hero-low p{grid-column:1/6;color:var(--tx2);max-width:46ch;font-size:1.05rem}
.ctas{grid-column:7/13;display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:900px){.hn,.hero-idx,.hero-low p,.ctas{grid-column:1/-1}.ctas{justify-content:flex-start}.hero-idx{margin-top:8px}}
/* sections */
section{padding:clamp(64px,10vw,140px) 0;border-top:1px solid var(--ln)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,56px)}
.sh h2{font-family:var(--serif);font-weight:300;font-size:clamp(2.2rem,5vw,4.2rem);line-height:1;letter-spacing:-.01em}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:clamp(28px,4vw,48px)}
.filters button{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);padding:10px 0;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
.filters button:hover{color:var(--tx)}
.filters button[aria-pressed=true]{color:var(--tx);border-color:var(--ac)}
.filters sup{color:var(--act);margin-left:4px;font-size:.65rem}
/* index grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(40px,5vw,64px) 24px;align-items:start}
.card{min-width:0}
.card[hidden]{display:none}
.card a{display:block}
.thumb{position:relative;overflow:hidden;background:var(--s2);border:1px solid var(--ln);aspect-ratio:1/1}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:filter .6s;filter:saturate(.9) brightness(.9)}
.card a:hover .thumb img{filter:none}
.thumb .tag{position:absolute;left:0;top:0;background:var(--bg);padding:7px 12px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);color:var(--act)}
.cmeta{display:flex;justify-content:space-between;gap:12px;margin:18px 0 6px;color:var(--tx2)}
.card h3{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,3vw,2.5rem);line-height:1.05}
.card p.d{color:var(--tx2);margin:10px 0 16px;max-width:52ch;font-size:.95rem}
.card .go{display:inline-block;border-bottom:1px solid var(--ln);padding-bottom:3px;transition:border-color .25s}
.card a:hover .go{border-color:var(--act)}
.ph{display:grid;place-content:center;text-align:center;gap:6px;padding:20px;min-height:200px;color:var(--tx2);border:1px dashed var(--ln);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(234,230,223,.025) 10px 11px)}
.thumb.ph{border-style:dashed;min-height:0}
.empty{padding:40px 0;color:var(--tx2)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
/* about */
.about{display:grid;grid-template-columns:repeat(12,1fr);gap:48px 24px}
.about .lead{grid-column:1/8;font-family:var(--serif);font-weight:300;font-size:clamp(1.7rem,3.2vw,2.8rem);line-height:1.2}
.about .facts{grid-column:9/13}
.about .cols{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:40px 24px;border-top:1px solid var(--ln);padding-top:36px}
.about h3,.facts h3{margin-bottom:14px;color:var(--act)}
.about li{padding:7px 0;border-bottom:1px solid var(--ln);color:var(--tx2);font-size:.92rem}
.about li strong{display:block;color:var(--tx);font-weight:400}
.about .edu{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:24px;border-top:1px solid var(--ln);padding-top:36px}
.edu h4{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin:6px 0 4px;line-height:1.15}
.edu p{color:var(--tx2);font-size:.95rem;max-width:56ch}
@media(max-width:900px){.about .lead,.about .facts{grid-column:1/-1}.about .cols{grid-template-columns:repeat(2,1fr)}.about .edu{grid-template-columns:1fr}}
@media(max-width:520px){.about .cols{grid-template-columns:1fr}}
/* contact */
.contact{text-align:left}
.contact h2{font-family:var(--serif);font-weight:300;font-size:clamp(2.6rem,8vw,7.4rem);line-height:.98;letter-spacing:-.02em;max-width:14ch}
.contact p.s{color:var(--tx2);max-width:44ch;margin:28px 0 44px;font-size:1.05rem}
.clist{border-top:1px solid var(--ln);max-width:760px}
.clist a,.clist .off{display:flex;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid var(--ln);font-family:var(--serif);font-size:clamp(1.3rem,2.4vw,1.9rem);transition:padding .3s,color .3s;overflow-wrap:anywhere}
.clist a:hover{padding-left:12px;color:var(--tx)}.clist a:hover .mono{color:var(--act)}
.clist .off{color:var(--tx2)}
footer.foot{border-top:1px solid var(--ln);padding:28px 0;color:var(--tx2)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a:hover{color:var(--tx)}
#up{position:fixed;right:max(var(--pad),env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:55;width:44px;height:44px;border:1px solid var(--ln);background:var(--bg);display:grid;place-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s,border-color .3s}
#up.show{opacity:1;visibility:visible}#up:hover{border-color:var(--act)}
/* case page */
.crumb{padding:28px 0 0;display:flex;justify-content:space-between;color:var(--tx2);gap:12px;flex-wrap:wrap}
.crumb a:hover{color:var(--tx)}
.chead{padding:clamp(40px,7vw,96px) 0 clamp(36px,5vw,64px)}
.chead .no{color:var(--act);margin-bottom:18px;display:block}
.chead h1{font-family:var(--serif);font-weight:300;font-size:clamp(3.2rem,11vw,10rem);line-height:.92;letter-spacing:-.025em;overflow-wrap:anywhere}
.bd{font-family:var(--serif);font-weight:300;font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.25;color:var(--tx2);max-width:34ch;margin-top:clamp(18px,2.4vw,28px)}
.cmeta4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ln);margin-top:clamp(28px,4vw,56px)}
.cmeta4 div{padding:16px 16px 16px 0;border-bottom:1px solid var(--ln)}.cmeta4 span{display:block;color:var(--tx2);margin-bottom:6px}
.cmeta4 b{font-weight:400;font-size:.98rem}
@media(max-width:700px){.cmeta4{grid-template-columns:1fr 1fr}}
.csec{padding:clamp(48px,7vw,96px) 0;border-top:1px solid var(--ln)}
.csec>.wrap>.sl{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.csec h2{grid-column:1/4;font-family:var(--mono);font-weight:400;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2)}
.csec h2 i{font-style:normal;color:var(--act);margin-right:6px}
.csec .body{grid-column:4/12}
.csec .body p{font-size:clamp(1.05rem,1.6vw,1.3rem);max-width:62ch;color:var(--tx)}
.csec .body p+p{margin-top:1.1em;color:var(--tx2)}
.note{margin-top:20px;color:var(--tx2);border-left:1px solid var(--act);padding-left:12px}
@media(max-width:860px){.csec h2,.csec .body{grid-column:1/-1}.csec h2{margin-bottom:6px}}
.pal{display:flex;margin:0 0 28px;border:1px solid var(--ln)}
.pal div{flex:1;height:96px;position:relative}.pal span{position:absolute;left:8px;bottom:6px;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;mix-blend-mode:difference;color:#fff}
.devgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start}
.devfig{margin:0}
.devgrid p{max-width:40ch}
@media(max-width:860px){.devgrid{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.gal{--n:var(--cols,3);--g:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:28px var(--g);margin-top:clamp(28px,4vw,48px)}
.gal figure{margin:0;flex:0 0 calc((100% - (var(--n) - 1)*var(--g))/var(--n));min-width:0}
.fig{display:block;position:relative;width:100%;aspect-ratio:var(--fr,4/3);border:1px solid var(--ln);background:var(--s2);overflow:hidden;transition:border-color .3s}
.fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fig:hover{border-color:var(--tx2)}
.gal figcaption{display:flex;gap:10px;margin-top:8px;color:var(--tx2)}.gal figcaption b{color:var(--act);font-weight:400}
@media(max-width:860px){.gal{--n:2}}@media(max-width:560px){.gal{--n:1}.gal.p{--n:2}}
.det{display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px}
.det dl>div{padding:16px 0;border-bottom:1px solid var(--ln)}.det dt{color:var(--tx2);margin-bottom:6px}.det dd{font-size:.98rem}
.det ul li{padding:4px 0}.det ul li::before{content:"— ";color:var(--act)}
@media(max-width:700px){.det{grid-template-columns:1fr}}
.next{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ln)}
.next a{padding:clamp(28px,5vw,64px) 0;display:block;transition:background .3s}
.next a+a{border-left:1px solid var(--ln);padding-left:clamp(20px,4vw,56px);text-align:right;padding-right:0}
.next .t{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,5vw,4.4rem);line-height:1;display:block;margin-top:10px;transition:color .3s,letter-spacing .4s}
.next a:hover .t{color:var(--tx);letter-spacing:.01em}.next .mono{color:var(--tx2)}
.next a:hover .mono{color:var(--act)}
@media(max-width:560px){.next{grid-template-columns:1fr}.next a+a{border-left:0;border-top:1px solid var(--ln);padding-left:0;text-align:left}}
/* lightbox */
dialog{border:0;background:rgba(10,10,10,.97);color:var(--tx);width:100vw;height:100dvh;max-width:none;max-height:none;padding:0;margin:0}
dialog::backdrop{background:#000}
.lb{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom,0px))}
.lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:center;gap:16px}
.lb-top button,.lb-bot button{border:1px solid var(--ln);padding:10px 16px;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2)}
.lb-top button:hover,.lb-bot button:hover{color:var(--tx);border-color:var(--tx)}
.lb img{margin:auto;max-height:100%;max-width:100%;object-fit:contain;min-height:0}
.lb-mid{min-height:0;display:flex;padding:14px 0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body id="top">
<div id="boot" role="status" aria-live="polite"><span class="mono dim">Opening archive / 001</span><div class="bar"></div></div>
<div class="lamp" aria-hidden="true"></div><div id="ball" aria-hidden="true"><i></i></div>
<header class="top" id="hdr"><div class="wrap">
  <a class="brand" href="#top" aria-label="Thanzeela — home">THANZEELA</a>
  <span class="status mono">Creative Archive / 001</span>
  <button class="menu-btn" id="mbtn" aria-expanded="false" aria-controls="nav" aria-label="Toggle menu"><span></span><span></span></button>
  <nav id="nav" aria-label="Primary"><ul>
    <li><a href="#top" data-s="top">Index</a></li><li><a href="#files" data-s="files">Case Files</a></li>
    <li><a href="#about" data-s="about">About</a></li><li><a href="#contact" data-s="contact">Contact</a></li>
    <li><button type="button" class="rbtn" id="resumeBtn" aria-label="Open resume as a PDF in a new tab">Resume <span aria-hidden="true">↗</span></button></li></ul></nav>
</div></header>
<main id="view" tabindex="-1"></main>
<footer class="foot"><div class="wrap mono"><span id="fcopy"></span><span>End of file</span><a href="#top" class="lnk">Return to top ↑</a></div></footer>
<button id="up" aria-label="Back to top"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor"><path d="M7 13V1M1 6l6-5 6 5"/></svg></button>
<dialog id="lb" aria-label="Image viewer"><div class="lb"><div class="lb-top mono"><span id="lbn" class="dim"></span><button id="lbx">Close ✕</button></div><div class="lb-mid"><img id="lbi" alt=""></div><div class="lb-bot mono"><button id="lbp">← Prev</button><span id="lbc" class="dim"></span><button id="lbnx">Next →</button></div></div></dialog>

<script>

   <header class="chead"><span class="no mono">File no. ${p.id}</span><h1>${esc(p.title)}</h1><p class="bd">${esc(p.desc)}</p>
   <div class="cmeta4 mono"><div><span>File number</span><b class="ac">${p.id}</b></div><div><span>Project title</span><b>${esc(p.title)}</b></div><div><span>Classification</span><b>${esc(p.cat)}</b></div><div><span>Project year</span><b>${p.year}</b></div></div></header></div>`;
  h+=sec('Case Summary',p.summary.map(t=>`<p>${esc(t)}</p>`).join(''));
  if(!p.lean){h+=sec('Creative Direction',p.direction.map(t=>`<p>${esc(t)}</p>`).join(''));
    const dv=DEV[p.slug];
    h+=sec('Design Development',dv?`<div class="devgrid"><figure class="devfig"><button class="fig" id="devb" style="--fr:5/4" aria-label="Enlarge: ${esc(dv[1])}">${img(dv[0],dv[2],'loading="lazy"')}</button></figure><div><span class="mono ac">${dv[3]==='sheet'?'Logo construction':'Detail study'}</span><p style="margin:10px 0 24px">${esc(dv[1])}</p>${pal}<p class="note mono">${dv[3]==='sheet'?'Flat redraw traced from the final logo, with indicative guides, circles and anchor points. It is not the original working file. Sketches and research can be added when supplied.':'Close-up taken from the final artwork. Sketches and research can be added here when supplied.'}</p></div></div>`
     :pal+`<div class="slots">${slots}</div><p class="note mono">Process material will be added here when supplied. These are placeholders, not final work.</p>`)}
  h+=ev();h+=sec('Project Details',det);
  h+=`<section class="csec" style="padding-bottom:0"><div class="wrap"><div class="mono dim" style="margin-bottom:18px"><i style="font-style:normal" class="ac">${N()}</i> — Next file</div></div><div class="wrap"><div class="next"><a href="#/case/${prev.slug}"><span class="mono">← Previous · ${prev.id}</span><span class="t">${esc(prev.title)}</span></a><a href="#/case/${next.slug}"><span class="mono">Next · ${next.id} →</span><span class="t">${esc(next.title)}</span></a></div></div></section>`;
  return h}

/* resume: opens the PDF named in CFG.resumeFile (a file next to index.html) in a new tab */
function openResume(){window.open(CFG.resumeFile+'?v='+Date.now(),'_blank')}
/* filters */
function applyFilter(){
  let n=0;$$('.card').forEach(c=>{const ok=state.cat==='All'||c.dataset.cat===state.cat;c.hidden=!ok;if(ok)n++});
  $$('.filters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===state.cat));
  $('#count').textContent=`${n} file${n===1?'':'s'} shown`;$('#empty').hidden=n>0;
}
/* lightbox */
const lb=$('#lb');let lbList=[],lbI=0;
function lbShow(){const g=lbList[lbI];const i=$('#lbi');i.src=IMG[g[0]].s;i.alt=g[2];$('#lbn').textContent=g[1];$('#lbc').textContent=`${lbI+1} / ${lbList.length}`}
function lbMove(d){lbI=(lbI+d+lbList.length)%lbList.length;lbShow()}
$('#lbx').onclick=()=>lb.close();$('#lbp').onclick=()=>lbMove(-1);$('#lbnx').onclick=()=>lbMove(1);
lb.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')lbMove(-1);if(e.key==='ArrowRight')lbMove(1)});
lb.addEventListener('click',e=>{if(e.target===lb)lb.close()});
/* routing */
function setTitle(t,d){document.title=t;$('meta[name=description]').content=d}
function route(){
  const h=location.hash,m=h.match(/^#\/case\/([\w-]+)/);
  closeMenu();
  if(m){const i=P.findIndex(p=>p.slug===m[1]);if(i<0){location.hash='#files';return}
    state.view='case:'+m[1];const p=P[i];view.innerHTML=caseHTML(i);window.scrollTo(0,0);
    setTitle(`${p.id} ${p.title} — Thanzeela S`,`${p.title}: ${p.desc}`);
    lbList=p.gallery;$$('.fig[data-n]').forEach(f=>f.onclick=()=>{lbList=p.gallery;lbI=+f.dataset.n;lbShow();lb.showModal()});
    const db=$('#devb');if(db)db.onclick=()=>{lbList=[DEV[p.slug]];lbI=0;lbShow();lb.showModal()};
    view.style.animation='none';view.offsetHeight;view.style.animation='';
  }else{
    if(state.view!=='home'){state.view='home';view.innerHTML=homeHTML();setTitle('Thanzeela S — Creative Archive / 001','Thanzeela S — multidisciplinary designer. A private archive of branding, packaging, poster and visual design case files.');
      $$('.filters button').forEach(b=>b.onclick=()=>{state.cat=b.dataset.c;applyFilter()});applyFilter();wireContact();
      view.style.animation='none';view.offsetHeight;view.style.animation='';
      const id=h.slice(1),t=id&&document.getElementById(id);t?t.scrollIntoView():window.scrollTo(0,0)}
    else if(h==='#top'||!h)window.scrollTo(0,0);
  }
  markNav();
}
/* nav */
const hdr=$('#hdr'),mbtn=$('#mbtn');
function closeMenu(){hdr.classList.remove('open');mbtn.setAttribute('aria-expanded','false')}
mbtn.onclick=()=>{const o=hdr.classList.toggle('open');mbtn.setAttribute('aria-expanded',o)};
$('#resumeBtn').onclick=()=>{closeMenu();openResume()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
function markNav(){const sects=state.view==='home'?['files','about','contact'].map(id=>document.getElementById(id)).filter(Boolean):[];
  $$('nav a').forEach(a=>a.classList.remove('cur'));if(state.view&&state.view.startsWith('case'))$('nav a[data-s=files]').classList.add('cur');
  if(io)io.disconnect();sects.forEach(s=>io&&io.observe(s))}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){$$('nav a').forEach(a=>a.classList.toggle('cur',a.dataset.s===e.target.id))}}),{rootMargin:'-40% 0px -55% 0px'}):null;
/* back to top */
const up=$('#up');addEventListener('scroll',()=>up.classList.toggle('show',scrollY>900),{passive:true});
up.onclick=()=>{scrollTo({top:0,behavior:reduce?'auto':'smooth'});if(location.hash==='#top')return;history.replaceState(null,'',location.pathname+location.search)};
/* light-ball cursor */
if(matchMedia('(pointer:fine)').matches){
  const b=$('#ball'),r=document.documentElement;r.classList.add('has-ball');let x=innerWidth/2,y=innerHeight/2,tx=x,ty=y;
  addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;b.classList.add('on');r.style.setProperty('--mx',tx+'px');r.style.setProperty('--my',ty+'px')},{passive:true});
  document.addEventListener('pointerleave',()=>b.classList.remove('on'));
  addEventListener('pointerover',e=>b.classList.toggle('big',!!e.target.closest('a,button,.fig')));
  (function f(){x+=(tx-x)*(reduce?1:.22);y+=(ty-y)*(reduce?1:.22);b.style.transform=`translate3d(${x}px,${y}px,0)`;requestAnimationFrame(f)})();
}
$('#fcopy').textContent=`© ${CFG.year} ${CFG.name}`;
addEventListener('hashchange',route);route();
setTimeout(()=>{$('#boot').classList.add('done')},reduce?0:950);
</script>
</body>
</html>
